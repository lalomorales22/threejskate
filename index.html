<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>threejskate</title>
	<style>
		body { margin: 0; overflow: hidden; background: #0a0a12; color: #fff; font-family: system-ui, sans-serif; }
		canvas { display: block; touch-action: none; }

		#hud {
			position: absolute;
			top: 14px;
			left: 16px;
			font-size: 14px;
			line-height: 1.3;
			background: rgba(0,0,0,0.35);
			padding: 10px 14px;
			border-radius: 8px;
			pointer-events: none;
			user-select: none;
		}
		#hud .score { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
		#hud .combo { color: #ffd24a; min-height: 18px; }
		#hud .keys  { opacity: 0.7; margin-top: 6px; font-size: 12px; }

		#trick-popup {
			position: absolute;
			top: 30%;
			left: 50%;
			transform: translate(-50%, -50%) scale(0.8);
			font-size: 42px;
			font-weight: 800;
			letter-spacing: 2px;
			color: #fff;
			text-shadow: 0 4px 24px rgba(0,0,0,0.6), 0 0 18px rgba(255,210,74,0.5);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease, transform 0.2s ease;
			user-select: none;
		}
		#trick-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

		#editor-link {
			position: absolute;
			bottom: 12px;
			right: 16px;
			color: #fff;
			font: 14px system-ui, sans-serif;
			text-decoration: none;
			background: rgba(0,0,0,0.45);
			padding: 8px 14px;
			border-radius: 6px;
			z-index: 10;
		}
		#editor-link:hover { background: rgba(0,0,0,0.7); }

		#net-chip {
			position: absolute;
			top: 14px;
			right: 16px;
			font: 13px system-ui, sans-serif;
			background: rgba(0,0,0,0.45);
			padding: 6px 12px;
			border-radius: 999px;
			user-select: none;
			pointer-events: none;
		}
		#net-chip .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ff5c5c; margin-right:6px; vertical-align:middle; }
		#net-chip.online .dot { background:#4ade80; }
		@media (pointer: coarse) {
			#editor-link { bottom: auto; top: 12px; right: 12px; }
			#hud { font-size: 12px; padding: 8px 10px; }
			#hud .score { font-size: 18px; }
		}
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.3"
		}
	}
	</script>
</head>
<body>
	<div id="hud">
		<div class="score">SCORE <span id="score">0</span></div>
		<div class="combo" id="combo">&nbsp;</div>
		<div class="keys">WASD steer · SPACE ollie · J flip · K grab · L grind · SHIFT stance · F1 customize · M map editor · TAB leaderboard</div>
	</div>
	<div id="trick-popup"></div>
	<div id="net-chip"><span class="dot"></span><span id="net-count">offline</span></div>
	<script type="module" src="js/main.js"></script>
</body>
</html>
